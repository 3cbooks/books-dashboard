# 直播预告监控 — 账号配置
# 每天自动跑时会逐个访问这些账号的主页，抓最近作品的预告信息
#
# 字段说明：
#   name      — 显示名（报告里看到的）
#   platform  — douyin / xiaohongshu
#   identifier— 抖音号 / 小红书 user_id（首次抓取后会自动补全 sec_uid）
#   url       — 主页 URL（如果你已经有，直接填，能跳过解析）
#   priority  — high / normal （高优先级失败时报警）

accounts:
  # ===== 抖音 =====
  - name: 宇辉同行
    platform: douyin
    identifier: 宇辉同行         # 抖音号或昵称（首次启动时通过搜索定位）
    priority: high

  - name: 冰冰的书房
    platform: douyin
    identifier: YUZHOUZHOUEDU
    priority: high

  - name: 木啊
    platform: douyin
    identifier: xuejie616
    priority: high

  - name: 中信书店直播间
    platform: douyin
    identifier: 中信书店直播间
    priority: normal

  - name: 中信书店官方旗舰店
    platform: douyin
    identifier: 中信书店官方旗舰店
    priority: normal

  - name: 中信书店图书旗舰店
    platform: douyin
    identifier: 中信书店图书旗舰店
    priority: normal

  - name: 中信出版童书旗舰店
    platform: douyin
    identifier: 中信出版童书旗舰店
    priority: normal

  # ===== 小红书 =====
  - name: 宇辉同行
    platform: xiaohongshu
    identifier: "49942471676"   # 用户 ID（小红书数字 ID）
    priority: high

  - name: 中信书店
    platform: xiaohongshu
    identifier: 中信书店         # 用昵称兜底（首次启动时搜索定位）
    priority: normal

# 抓取参数
options:
  posts_per_account: 10        # 每个账号抓最近 N 条
  days_lookback:    14         # 只看最近 N 天的作品（避免老作品干扰预告时间）
  request_timeout:  30         # 单次请求超时（秒）
  delay_between:    [3, 6]     # 账号间隔（秒，随机范围）
